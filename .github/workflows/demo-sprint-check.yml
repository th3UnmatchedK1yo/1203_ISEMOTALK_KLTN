name: Demo sprint checks

on:
  push:
    branches:
      - feat/demo-sprint-api-20261102
      - feat/real-audio-intake-20261102
      - feat/readability-theme-20261102
      - feat/offline-faster-whisper-asr-20261102
      - fix/qa-workflow-audit-20261114
      - feat/thesis-demo-hardening-20261122
  pull_request:
    branches:
      - main
      - feat/demo-sprint-api-20261102
      - feat/real-audio-intake-20261102
      - feat/readability-theme-20261102
      - feat/offline-faster-whisper-asr-20261102
      - fix/qa-workflow-audit-20261114
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-startup-checks:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check Windows startup, database and file cleanup without model downloads
        run: npm test -- server/tests/demo-startup.test.ts server/tests/local-readiness.test.ts server/tests/python-runtime.test.ts server/tests/db-integrity.test.ts server/tests/db-workflow-history.test.ts server/tests/db-check.test.ts server/tests/audio-cleanup.test.ts
      - name: Parse and run bounded Windows model inventory without downloads
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/diagnose-ser-local.ps1').Path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          & .\scripts\diagnose-ser-local.ps1 -BackupDir (Join-Path $env:RUNNER_TEMP 'missing-ser-backup')
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build frontend
        run: npm run build
      - name: Typecheck backend
        run: npm run typecheck:server
      - name: Backend tests
        run: npm test
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight inference test requirements
        run: python -m pip install --no-cache-dir -r inference/requirements-test.txt
      - name: Install audio tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Offline ASR unit tests (no weights or GPU)
        working-directory: inference
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Validate PowerShell setup script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/enable-offline-asr.ps1').Path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }
