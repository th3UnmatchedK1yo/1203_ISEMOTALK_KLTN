name: Demo sprint checks

on:
  push:
    branches:
      - feat/demo-sprint-api-20261102
      - feat/real-audio-intake-20261102
      - feat/readability-theme-20261102
      - feat/offline-faster-whisper-asr-20261102
  pull_request:
    branches:
      - main
      - feat/demo-sprint-api-20261102
      - feat/real-audio-intake-20261102
      - feat/readability-theme-20261102
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build frontend
        run: npm run build
      - name: Typecheck backend
        run: npm run typecheck:server
      - name: Backend tests
        run: npm test
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight ASR test requirements
        run: python -m pip install --no-cache-dir "numpy>=1.26,<3"
      - name: Offline ASR unit tests (no weights or GPU)
        working-directory: inference
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Validate PowerShell setup script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/enable-offline-asr.ps1').Path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }
