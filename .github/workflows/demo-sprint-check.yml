name: Demo sprint checks

on:
  push:
    branches:
      - feat/demo-sprint-api-20261102
      - feat/real-audio-intake-20261102
      - feat/readability-theme-20261102
      - feat/offline-faster-whisper-asr-20261102
      - fix/qa-workflow-audit-20261114
      - feat/thesis-demo-hardening-20261122
      - feat/remote-gpu-full-pipeline-20261123
  pull_request:
    branches:
      - main
      - feat/demo-sprint-api-20261102
      - feat/real-audio-intake-20261102
      - feat/readability-theme-20261102
      - feat/offline-faster-whisper-asr-20261102
      - fix/qa-workflow-audit-20261114
      - feat/thesis-demo-hardening-20261122
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-startup-checks:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check Windows startup, database and file cleanup without model downloads
        run: npm test -- server/tests/demo-startup.test.ts server/tests/local-readiness.test.ts server/tests/python-runtime.test.ts server/tests/node-repair.test.ts server/tests/db-integrity.test.ts server/tests/db-workflow-history.test.ts server/tests/db-check.test.ts server/tests/audio-cleanup.test.ts server/tests/service-operations.test.ts
      - name: Check one-click SSH command contract on Windows
        run: node --test scripts/oneclick-ssh.test.mjs
      - name: Parse and run bounded Windows model inventory without downloads
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/diagnose-ser-local.ps1').Path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          & .\scripts\diagnose-ser-local.ps1 -BackupDir (Join-Path $env:RUNNER_TEMP 'missing-ser-backup')
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate remote launcher syntax
        run: |
          node --check scripts/start-remote-web.mjs
          node --check scripts/check-remote-models.mjs
          node --check scripts/check-remote-server.mjs
          node --check scripts/start-remote-server.mjs
          node --check scripts/remote-real-smoke.mjs
          node --check scripts/remote-qa-smoke.mjs
          node --check scripts/start-remote-api-preview.mjs
          node --check scripts/check-remote-mvp.mjs
          node --check scripts/start-remote-midterm-demo.mjs
          node --check scripts/start-remote-speech-demo.mjs
          node --check scripts/start-remote-qa-runtime.mjs
          node --check scripts/open-isemotalk.mjs
          node --check scripts/oneclick-ssh.mjs
          node --test scripts/oneclick-ssh.test.mjs
          node --check scripts/check-remote-qa.mjs
          node --check scripts/choose-midterm-call.mjs
      - name: Validate Linux GPU setup script without running installs
        run: |
          bash -n scripts/bootstrap-gpu-host.sh scripts/stage-gpu-models.sh scripts/train-callcenter-qa.sh scripts/launch-parallel-datasets.sh scripts/run-qa-replications.sh scripts/monitor-parallel.sh
          python -m py_compile inference/scripts/download_onevoice.py inference/scripts/train_onevoice_qa.py inference/app/qa_triage.py inference/scripts/download_asr_benchmarks.py inference/scripts/eval_onevoice_baselines.py
      - name: Build frontend
        run: npm run build
      - name: Typecheck backend
        run: npm run typecheck:server
      - name: Backend tests
        run: npm test
      - name: Install isolated browser verification tools
        run: |
          npm install --prefix "$RUNNER_TEMP/isemo-browser-tools" --no-audit --no-fund playwright@1.62.1
          node "$RUNNER_TEMP/isemo-browser-tools/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify service workflow and draft recovery in Chromium
        env:
          ISEMO_PLAYWRIGHT_PATH: ${{ runner.temp }}/isemo-browser-tools/node_modules/playwright
          ISEMO_BROWSER_OUTPUT: ${{ runner.temp }}/isemo-browser-artifacts
        run: node scripts/verify-service-browser.mjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-browser-evidence
          path: ${{ runner.temp }}/isemo-browser-artifacts
          if-no-files-found: ignore
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight inference test requirements
        run: python -m pip install --no-cache-dir -r inference/requirements-test.txt
      - name: Install audio tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Offline ASR unit tests (no weights or GPU)
        working-directory: inference
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Validate PowerShell setup script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/enable-offline-asr.ps1').Path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/start-vscode-preview.ps1').Path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }
